<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tic-Tac-Toe</title>
  <link rel="icon" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="card">
    <h1>Tic-Tac-Toe</h1>

    <div class="players" id="players" hidden>
      <span class="chip" id="chip-x" data-mark="X"><b>X</b><span class="dot"></span><span class="who" id="who-x"></span></span>
      <span class="chip" id="chip-o" data-mark="O"><b>O</b><span class="dot"></span><span class="who" id="who-o"></span></span>
    </div>
    <p class="watchers" id="watchers"></p>

    <div class="board" id="board" role="group" aria-label="Game board"></div>

    <p class="status" id="status" role="status" aria-live="polite">Connecting…</p>
    <p class="flash" id="flash" hidden></p>
    <p class="banner" id="banner" hidden></p>

    <div class="invite" id="invite" hidden>
      <p class="muted">Send this link to your opponent</p>
      <div class="invite-row">
        <input class="invite-url" id="invite-url" readonly aria-label="Invite link">
        <button class="primary" id="copy" type="button">Copy</button>
      </div>
    </div>
  </main>
  <script src="/static/game.js"></script>
</body>
</html>
